name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # every 3 hours: refresh the Trending news (Manipur > Northeast > India > World)
    - cron: "17 */3 * * *"

permissions:
  contents: write   # lets the build commit new Gemini translations back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Translate new stories (Gemini)
        # Uses the repo secret GEMINI_API_KEY. No key or a Gemini problem = skipped, site still publishes.
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 translate_gemini.py
      - name: Save new translations to the repo
        continue-on-error: true
        run: |
          git add translations
          if git diff --cached --quiet; then echo "no new translations"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-translate (Gemini)"
          git pull --rebase origin main || git rebase --abort || true
          git push origin HEAD:main
      - name: Build site
        env:
          URL: https://mirrorlilong.com
        run: |
          python3 build.py
          python3 translate_inject.py || echo "translations step failed; site published without language switch"
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
