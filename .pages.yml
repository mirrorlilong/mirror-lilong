# Pages CMS (app.pagescms.org) settings: the phone admin panel for Mirror Lilong.
# Saving here commits to GitHub; the site rebuilds and goes live in about 1-2 minutes.
media:
  input: static/img
  output: /img
  categories: [image]
  rename: safe


content:
  - name: stories
    label: News stories
    type: collection
    path: content/stories
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, category, date]
      primary: title
      sort: [date, title]
      search: [title, summary]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: date
        label: Date and time
        description: Newest stories show first.
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: category
        label: Section
        type: select
        required: true
        default: Manipur
        options:
          values: [Manipur, Northeast, India, World, Sports, Entertainment]
      - name: also_in
        label: Also show in another section (optional)
        type: select
        options:
          values: [Manipur, Northeast, India, World, Sports, Entertainment]
      - name: state
        label: State (Northeast)
        description: Optional. Puts the story on that state's page under Northeast.
        type: select
        options:
          values: [Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Tripura]
      - name: summary
        label: Short summary (1-2 lines under the headline)
        type: text
      - name: image
        label: Photo
        description: Shown on the home page and at the top of the story.
        type: image
        required: true
      - name: image_credit
        label: Photo credit
        type: string
        default: "Image: Mirror Lilong"
      - name: body
        label: Story text
        description: Leave an empty line between paragraphs. To show a photo from "More photos", type [photo1], [photo2]... on its own line.
        type: text
        required: true
      - name: photos
        label: More photos (optional)
        description: Upload extra photos. In Story text, type [photo1], [photo2]... on its own line where each should appear. Photos without a marker show at the end.
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
          - name: caption
            label: Caption or story text under this photo (optional)
            description: A short line shows as a small grey caption. Longer text shows as normal story paragraphs below the photo.
            type: text
      - name: writer
        label: Reporter / writer byline (optional)
        description: Pick a writer to show their name and photo on this news story.
        type: reference
        options:
          collection: writers
          search: name
          value: "{path}"
          label: "{name}"
      - name: author
        label: Writer name shown as the byline (optional)
        description: Pick the writer for this story. Leave on Mirror Lilong Desk to show the desk name.
        type: select
        default: Mirror Lilong Desk
        options:
          values: [Mirror Lilong Desk, Abdul Roufh, S Nadhrul Muneer]
      - name: facebook
        label: Facebook post link (optional)
        description: Adds a "Read on Facebook" link.
        type: string
      - name: sources
        label: Source links (optional)
        type: object
        list: true
        fields:
          - name: name
            label: Source name (e.g. The Hindu)
            type: string
          - name: url
            label: Link
            type: string
      - name: lead
        label: Big story at the top of the home page
        description: If several are on, the newest one is used.
        type: boolean
        default: false
      - name: breaking
        label: Show in the BREAKING ticker
        type: boolean
        default: false
      - name: top
        label: Show in Top Stories
        type: boolean
        default: true
      - name: trending
        label: Show in Trending
        type: boolean
        default: false
      - name: desk
        label: Mirror Lilong's own story (red badge)
        type: boolean
        default: true
      - name: video
        label: Video story (play icon, listed on Videos)
        type: boolean
        default: false
      - name: full_image
        label: Different full-size photo for the story page (optional)
        type: image
      - name: hidden
        label: Hide this story from the website
        type: boolean
        default: false

  # ---------- Ads: banner ads (E-Kart etc.). Top = above the stories on every page, Middle = on the home page
  # between news sections, Bottom = just above the footer. Switch an ad off with "Show" (no gap is left).
  - name: ads
    label: Ads
    type: collection
    path: data/ads
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, spot, active]
      primary: title
      sort: [title]
      search: [title, link]
    fields:
      - name: title
        label: Ad name (for you; also the picture's alt text)
        type: string
        required: true
      - name: image
        label: Ad picture (wide banner works best, e.g. 1080 x 280)
        type: image
        required: true
      - name: link
        label: Link (where a click goes, e.g. https://wa.me/91XXXXXXXXXX)
        type: string
        required: true
      - name: spot
        label: Where it shows
        description: Top = above the stories on every page. Middle = on the home page between news sections. Bottom = just above the footer.
        type: select
        required: true
        default: top
        options:
          values: [top, middle, bottom]
      - name: active
        label: Show on the site
        description: Switch off to hide the ad. Nothing is shown in its place.
        type: boolean
        default: true
      - name: end
        label: Stop showing after (optional)
        description: Leave empty to keep it on until you switch it off.
        type: date
        options:
          format: "yyyy-MM-dd"

  # ---------- Writers: Opinion, Prose & Verse, Story, Article (English only, not translated) ----------
  # ---------- Translations: edit a translated story, or add one yourself. The file name must be the SAME as the
  # English story's file name (e.g. manipur-welcomes-home-lanchenbi-chanu-after-historic-youth-olympic-bronze.json).
  # Once a story has a file here, the automatic Gemini translation never touches it.
  - name: translations
    label: Translations (edit / add)
    type: collection
    path: translations
    format: json
    filename: "{primary}.json"
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: English headline (used for searching - leave as it is)
        type: string
      - name: mni-Mtei
        label: Manipuri - Meetei Mayek
        type: object
        fields:
          - name: title
            label: Headline
            type: string
          - name: summary
            label: Short summary
            type: text
          - name: body
            label: Story text (empty line between paragraphs; **bold** for sub-headings)
            type: text
          - name: captions
            label: Photo captions (one per photo, in the same order as the English story)
            type: text
            list: true
      - name: mni-Beng
        label: Manipuri - Bengali script
        type: object
        fields:
          - name: title
            label: Headline
            type: string
          - name: summary
            label: Short summary
            type: text
          - name: body
            label: Story text (empty line between paragraphs; **bold** for sub-headings)
            type: text
          - name: captions
            label: Photo captions (one per photo, in the same order as the English story)
            type: text
            list: true
      - name: mni-Latn
        label: Manipuri - Roman (casual)
        type: object
        fields:
          - name: title
            label: Headline
            type: string
          - name: summary
            label: Short summary
            type: text
          - name: body
            label: Story text (empty line between paragraphs; **bold** for sub-headings)
            type: text
          - name: captions
            label: Photo captions (one per photo, in the same order as the English story)
            type: text
            list: true
      - name: hi
        label: Hindi
        type: object
        fields:
          - name: title
            label: Headline
            type: string
          - name: summary
            label: Short summary
            type: text
          - name: body
            label: Story text (empty line between paragraphs; **bold** for sub-headings)
            type: text
          - name: captions
            label: Photo captions (one per photo, in the same order as the English story)
            type: text
            list: true
      - name: en
        label: English (leave as it is)
        type: object
        fields:
          - name: title
            label: Headline
            type: string
          - name: summary
            label: Short summary
            type: text
          - name: body
            label: Story text
            type: text
      - name: _meta
        label: Technical info (leave as it is)
        type: object
        fields:
          - name: source_lang
            label: source_lang
            type: string
          - name: engine
            label: engine
            type: string
          - name: method
            label: method
            type: text
          - name: generated
            label: generated
            type: string
          - name: hi
            label: hi
            type: text
          - name: captions
            label: captions
            type: text
          - name: model
            label: model
            type: string

  - name: writers
    label: Writers
    type: collection
    path: content/writers
    format: json
    filename: "{primary}.json"
    view:
      fields: [name, role]
      primary: name
      sort: [name]
      search: [name, bio]
    fields:
      - name: name
        label: Full name
        type: string
        required: true
      - name: role
        label: Role
        type: select
        required: true
        default: Journalist
        options:
          values: [Journalist, Correspondent, Columnist, Guest Writer, Blogger, Poet, Author, Editor]
      - name: photo
        label: Photo (square works best)
        description: Optional. Without a photo, the writer's initials are shown in a red circle.
        type: image
      - name: location
        label: Place (optional, e.g. Lilong, Manipur)
        type: string
      - name: bio
        label: Short bio (2-3 lines)
        type: text
      - name: facebook
        label: Facebook link (optional)
        type: string
      - name: instagram
        label: Instagram link (optional)
        type: string
      - name: x
        label: X / Twitter link (optional)
        type: string
      - name: email
        label: Email (optional, shown publicly)
        type: string
      - name: hidden
        label: Hide this writer from the website
        type: boolean
        default: false

  - name: writings
    label: Writings (Opinion, Prose & Verse, Story, Article)
    type: collection
    path: content/writings
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, category, date]
      primary: title
      sort: [date, title]
      search: [title, summary]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        description: Opinion, Prose & Verse (prose and poems), Story (short stories, fiction) or Article.
        type: select
        required: true
        default: Opinion
        options:
          values: [Opinion, Prose & Verse, Story, Article]
      - name: writer
        label: Writer
        description: Pick from Writers. Add the writer there first.
        type: reference
        required: true
        options:
          collection: writers
          search: name
          value: "{path}"
          label: "{name}"
      - name: date
        label: Date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: summary
        label: Short summary (optional, 1-2 lines under the title)
        type: text
      - name: image
        label: Photo (optional)
        type: image
      - name: image_credit
        label: Photo credit (optional)
        type: string
      - name: body
        label: Text
        description: "Opinion and Article: leave an empty line between paragraphs. Prose & Verse and Story: every line break is kept exactly; leave an empty line between paragraphs or stanzas."
        type: text
        required: true
      - name: pull_quote
        label: Highlighted quote (optional, Opinion and Article only)
        description: One striking line, shown big in the middle of the page.
        type: string
      - name: photos
        label: More photos (optional)
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
          - name: caption
            label: Caption (optional)
            type: text
      - name: hidden
        label: Hide from the website
        type: boolean
        default: false

  - name: videos
    label: Videos page
    type: file
    path: content/settings/videos.json
    format: json
    fields:
      - name: links
        label: Video links
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: Link (Facebook, YouTube or Instagram)
            type: string
          - name: image
            label: Thumbnail
            type: image
          - name: where
            label: Where it plays
            type: select
            options:
              values: [Facebook, YouTube, Instagram]
