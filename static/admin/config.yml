# Mirror Lilong admin panel settings (Sveltia CMS, reads the same format as Decap/Netlify CMS).
backend:
  name: github
  repo: mirrorlilong/mirror-lilong
  branch: main
  # Sign-in goes through Netlify's GitHub login (api.netlify.com) for the site this panel is served from.
  commit_messages:
    create: "Add story: {{slug}}"
    update: "Edit story: {{slug}}"
    delete: "Delete story: {{slug}}"
    uploadMedia: "Upload photo: {{path}}"
    deleteMedia: "Delete photo: {{path}}"

site_url: https://mirror-lilong.netlify.app
display_url: https://mirror-lilong.netlify.app
logo:
  src: /favicon.svg

media_folder: static/img/uploads
public_folder: /img/uploads

media_libraries:
  default:
    config:
      max_file_size: 25000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: stories
    label: News stories
    label_singular: Story
    description: Every story on the website. Tap "New story" to post one. It appears on the site about a minute after you tap Save.
    folder: content/stories
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.title}}"
    identifier_field: title
    summary: "{{fields.title}}"
    sortable_fields:
      fields: [date, title, category]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: Manipur, field: category, pattern: Manipur }
      - { label: Northeast, field: category, pattern: Northeast }
      - { label: India, field: category, pattern: India }
      - { label: World, field: category, pattern: World }
      - { label: Sports, field: category, pattern: Sports }
      - { label: Entertainment, field: category, pattern: Entertainment }
      - { label: Big story on top, field: lead, pattern: true }
      - { label: In Breaking ticker, field: breaking, pattern: true }
    fields:
      - { name: title, label: Headline, widget: string }
      - { name: date, label: Date and time, widget: datetime, format: "YYYY-MM-DDTHH:mm", default: "{{now}}", hint: Newest stories show first. }
      - name: category
        label: Section
        widget: select
        options: [Manipur, Northeast, India, World, Sports, Entertainment]
        default: Manipur
      - name: also_in
        label: Also show in another section (optional)
        widget: select
        required: false
        options: [Manipur, Northeast, India, World, Sports, Entertainment]
      - { name: summary, label: Short summary (1–2 lines under the headline), widget: text, required: false }
      - { name: image, label: Photo, widget: image, hint: "Shown on the home page and at the top of the story. Portrait news cards work too." }
      - { name: image_credit, label: Photo credit, widget: string, default: "Image: Mirror Lilong", required: false }
      - name: body
        label: Story text
        widget: markdown
        buttons: [bold, italic, link, heading-three, bulleted-list, numbered-list, quote]
        editor_components: []
        hint: Leave an empty line between paragraphs.
      - { name: facebook, label: Facebook post link (optional), widget: string, required: false, hint: Adds a "Read on Facebook" link. }
      - name: sources
        label: Source links (optional)
        label_singular: source
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: Source name, widget: string, hint: "e.g. The Hindu" }
          - { name: url, label: Link, widget: string }
      - { name: lead, label: Big story at the top of the home page, widget: boolean, required: false, default: false, hint: "If several are on, the newest one is used." }
      - { name: breaking, label: Show in the BREAKING ticker, widget: boolean, required: false, default: false }
      - { name: top, label: Show in Top Stories, widget: boolean, required: false, default: true }
      - { name: trending, label: Show in Trending, widget: boolean, required: false, default: false }
      - { name: desk, label: Mirror Lilong's own story (adds the red badge), widget: boolean, required: false, default: true }
      - { name: video, label: Video story (adds a play icon and lists it on Videos), widget: boolean, required: false, default: false }
      - { name: full_image, label: Different full-size image for the story page (optional), widget: image, required: false }
      - { name: hidden, label: Hide this story from the website, widget: boolean, required: false, default: false }

  - name: settings
    label: Videos page
    files:
      - name: videos
        label: Videos page links
        file: content/settings/videos.json
        format: json
        fields:
          - name: links
            label: Video links
            label_singular: video link
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: url, label: "Link (Facebook, YouTube or Instagram)", widget: string }
              - { name: image, label: Thumbnail, widget: image }
              - name: where
                label: Where it plays
                widget: select
                options: [Facebook, YouTube, Instagram]
                default: Facebook
