<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mirror Lilong Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <script>
    // Sveltia CMS (phone-friendly) on current browsers; Decap CMS on older ones.
    // Both read the same story files. Versions are pinned so updates never change the panel unexpectedly.
    (function () {
      var modern = typeof Uint8Array.prototype.toBase64 === 'function' && typeof Uint8Array.fromBase64 === 'function';
      var s = document.createElement('script');
      if (modern) {
        s.src = 'https://unpkg.com/@sveltia/cms@0.253.1/dist/sveltia-cms.js';
      } else {
        var l = document.createElement('link');
        l.rel = 'cms-config-url'; l.type = 'text/yaml'; l.href = '/admin/config-decap.yml';
        document.head.appendChild(l);
        s.src = 'https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js';
      }
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
